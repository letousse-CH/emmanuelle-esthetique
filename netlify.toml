[build]
  command = "npm run build"
  publish = ".next"

[functions]
  # Fonctions planifiées : elles ne font qu'appeler /api/cron/* avec
  # CRON_SECRET. Sans elles, la publication différée, la pré-génération des
  # posts et les automatisations « planifiées » n'étaient jamais déclenchées.
  directory = "netlify/functions"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Sécurité + aide les crawlers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self' data: blob: https: http: wss://*.supabase.co; frame-src https://js.stripe.com https://checkout.stripe.com; object-src 'none'; base-uri 'self';"

# Pas de proxy /medias/* : les médias sont servis directement depuis Cloudflare
# R2 (NEXT_PUBLIC_R2_PUBLIC_URL) ou depuis Supabase Storage du projet courant.
# Un `to` codé en dur ici pointerait sur le Storage du projet d'origine —
# voir src/utils/media.ts, qui dérive l'URL de NEXT_PUBLIC_SUPABASE_URL.
