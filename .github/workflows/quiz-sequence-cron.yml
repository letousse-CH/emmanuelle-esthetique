name: Décodeur — cron séquence email

# Déclenche périodiquement /api/cron/quiz-sequence, qui n'est qu'un endpoint
# HTTP passif (comme toute route Next.js) : il ne s'exécute jamais tout seul,
# il faut que quelque chose l'appelle sur un rythme régulier. GitHub Actions
# joue ce rôle ici (gratuit, versionné avec le code, pas de compte tiers).
#
# Mise en route (une seule fois) :
#   1. Dans Netlify → Site settings → Environment variables, vérifier/définir
#      CRON_SECRET (même valeur que si elle existe déjà pour /api/cron/publish).
#   2. Dans GitHub → Settings → Secrets and variables → Actions, ajouter un
#      secret de dépôt CRON_SECRET avec exactement la même valeur.
# Sans CRON_SECRET, l'endpoint reste appelable sans authentification.

on:
  schedule:
    - cron: '*/15 * * * *' # toutes les 15 min — ajuster si besoin (ex. '0 * * * *' pour toutes les heures)
  workflow_dispatch: {} # permet de déclencher un run manuel depuis l'onglet Actions

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/quiz-sequence
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Longueur du secret lu par GitHub Actions : ${#CRON_SECRET} caractères (doit faire 64)"
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://audeladeschaines.com/api/cron/quiz-sequence")
          echo "HTTP status: $status"
          cat /tmp/response.json
          echo
          if [ "$status" -ge 400 ]; then
            echo "::error::L'appel a échoué (HTTP $status) — vérifier que le secret CRON_SECRET (GitHub) correspond exactement à celui de Netlify."
            exit 1
          fi
